services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: 'postgres-db'
    environment:
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgres'
      - 'POSTGRES_DB=urlshortener_db'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d urlshortener_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: 'ghcr.io/siyfred/url-shortener-api:latest'
    container_name: 'url-shortener-api'
#    ports:
#      - '8080:8080'
    expose:
      - '8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - 'DB_URL=jdbc:postgresql://postgres:5432/urlshortener_db'
      - 'DB_USERNAME=postgres'
      - 'DB_PASSWORD=postgres'
      - 'REDIS_HOST=redis'
      - 'RABBITMQ_HOST=rabbitmq'
      - 'RABBITMQ_USER=appuser'
      - 'RABBITMQ_PASS=appuser'
      - 'JWT_SECRET=${JWT_SECRET:-jwtsecretsupersecret}'
      - 'APP_BASE_URL=https://api.url-shortener.siyfred.dev'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  redis:
    image: 'redis:8-alpine'
    container_name: 'redis-cache'
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: 'rabbitmq:3.13-management-alpine'
    container_name: 'rabbitmq'
    environment:
      - 'RABBITMQ_DEFAULT_USER=appuser'
      - 'RABBITMQ_DEFAULT_PASS=appuser'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  rabbitmq_data:
