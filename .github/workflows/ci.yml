name: CI

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: "temurin"
        cache: maven

    - name: Run tests and build
      run: mvn clean package
